# Kitty theme derived from ~/.config/starship.toml

# Typography
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
adjust_line_height 3
disable_ligatures never

# Window
remember_window_size  yes
initial_window_width  120c
initial_window_height 34c
window_padding_width  12
placement_strategy    center
confirm_os_window_close 0
macos_titlebar_color background
macos_option_as_alt  both

# A translucent midnight backdrop with a quiet Totoro in the top-right.
background_opacity 0.93
dynamic_background_opacity yes
background_blur 24
window_logo_path totoro-corner.png
window_logo_position top-right
window_logo_alpha 0.35
window_logo_scale 22

# Tabs echo Starship's segmented prompt.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #FDF5E6
active_tab_background   #C0392B
inactive_tab_foreground #FDF5E6
inactive_tab_background #2C3E50
tab_bar_background      #1D2230

# Starship palette
foreground            #FDF5E6
background            #1D2230
selection_foreground  #FDF5E6
selection_background  #4682B4
cursor                #F1C40F
cursor_text_color     #2C3E50
url_color             #4682B4
active_border_color   #4682B4
inactive_border_color #2C3E50
bell_border_color     #F1C40F
visual_bell_color     #C0392B

# ANSI colors: midnight, red, olive, yellow, steel blue, forest, mist, ivory.
color0  #1D2230
color1  #C0392B
color2  #6F7F3F
color3  #F1C40F
color4  #4682B4
color5  #656338
color6  #6FA3B8
color7  #FDF5E6
color8  #566573
color9  #E84D44
color10 #8DA64B
color11 #F7DC6F
color12 #6FA8DC
color13 #8D8A5C
color14 #9CCBD5
color15 #FFF9EC

# Small interaction polish
cursor_shape beam
cursor_blink_interval 0.6
shell_integration enabled
detect_urls yes
url_style curly
inactive_text_alpha 0.78

